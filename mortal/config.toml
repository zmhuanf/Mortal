# 标记说明:
#   GRP训练      = train_grp.py 训练 GRP 模型
#   baseline训练 = train.py 以 is_baseline=true 模式训练 baseline
#   离线训练     = train.py 以 online=false 模式训练正式模型
#   在线训练     = train.py 以 online=true 模式训练 + server.py + client.py
#   1v3          = one_vs_three.py 1v3 对战评估
#   review       = mortal.py review 模式分析对局

# ============================================================
# [control] 基础训练控制 (baseline训练|离线训练|在线训练|1v3|review)
# ============================================================
[control]
# 观测编码版本号，4 = ConvNeXt + LayerNorm 架构 (baseline训练|离线训练|在线训练|1v3|review)
version = 4

# 是否在线训练模式，false = 离线从牌谱学习，true = 在线 self-play (baseline训练|离线训练|在线训练)
online = false

# 是否为 baseline 训练模式，true 时跳过 test_play 和 TestPlayer 初始化 (baseline训练|离线训练|在线训练)
is_baseline = true

# 训练 checkpoint 保存路径，每次 save_every 步自动保存，可从中断处恢复 (baseline训练|离线训练|在线训练)
state_file = 'D:/Workspace/Mortal/mortal/baseline_v1/mortal.pth'

# 最优模型保存路径，test_play 评估超过历史最优时自动保存 (离线训练|在线训练)
best_state_file = 'D:/Workspace/Mortal/mortal/mortal_v2/best.pth'

# TensorBoard 日志目录 (baseline训练|离线训练|在线训练)
tensorboard_dir = 'D:/Workspace/Mortal/mortal/baseline_v1/log'

# 训练用 GPU 设备 (baseline训练|离线训练|在线训练)
device = 'cuda:0'

# 是否启用 cudnn benchmark 自动选择最优卷积算法 (baseline训练|离线训练|在线训练)
enable_cudnn_benchmark = true

# 是否启用混合精度训练 (AMP) (baseline训练|离线训练|在线训练)
enable_amp = true

# 是否启用 torch.compile 编译优化 (baseline训练|离线训练|在线训练)
enable_compile = false

# 每批样本数 (baseline训练|离线训练|在线训练)
batch_size = 512

# 梯度累积步数，每 opt_step_every 个 batch 才执行一次 optimizer.step() (baseline训练|离线训练|在线训练)
opt_step_every = 1

# 每隔多少步保存 checkpoint + 写 TensorBoard (baseline训练|离线训练|在线训练)
save_every = 400

# 每隔多少步执行一次 test_play 1v3 对战评估 (离线训练|在线训练)
test_every = 20000

# 在线训练时每隔多少步向 server 提交最新参数 (在线训练)
submit_every = 400

# ============================================================
# [train_play] 在线 self-play 配置 (在线训练)
# 环境变量 TRAIN_PLAY_PROFILE 选择对应 profile，默认 'default'
# ============================================================
[train_play.default]
# 每次 train_play 的对局数 (在线训练)
games = 800

# self-play 对局日志保存目录 (在线训练)
log_dir = 'D:/Workspace/Mortal/mortal/mortal_v2/train_play'

# Boltzmann 探索的 epsilon，表示非贪婪采样的概率 (在线训练)
boltzmann_epsilon = 0.005

# Boltzmann 采样温度，越低越接近贪婪 (在线训练)
boltzmann_temp = 0.05

# top-p 采样阈值，1.0 = 不做 top-p 过滤 (在线训练)
top_p = 1.0

# 相同 seed 重复对局次数，用于数据增强 (在线训练)
repeats = 1

# ============================================================
# [test_play] test_play 1v3 对战评估配置 (离线训练|在线训练)
# is_baseline=true 时整体跳过
# ============================================================
[test_play]
# 每次评估的对局总数，实际 seed 数 = games // 4 (离线训练|在线训练)
games = 3000

# 评估对局日志保存目录 (离线训练|在线训练)
log_dir = 'D:/Workspace/Mortal/mortal/mortal_v2/test_play'

# ============================================================
# [dataset] 牌谱数据集配置 (baseline训练|离线训练|在线训练)
# 在线训练时从 drain 目录加载 self-play 数据，忽略此配置
# ============================================================
[dataset]
# 牌谱文件 glob 模式，支持 .mjson 和 .json.gz (baseline训练|离线训练)
globs = ['D:/Data/**/*.mjson']

# 文件索引缓存路径，首次构建后后续启动跳过 glob 扫描 (baseline训练|离线训练)
file_index = 'D:/Workspace/Mortal/mortal/mortal_v2/file_index.pth'

# 每次并行加载的文件数，影响内存占用和 IO 吞吐 (baseline训练|离线训练)
file_batch_size = 15

# 保留比例，前 reserve_ratio 比例的样本不参与训练，用于验证 (baseline训练|离线训练)
reserve_ratio = 0.0

# DataLoader 工作进程数 (baseline训练|离线训练)
num_workers = 4

# 只加载包含这些玩家名的牌谱，空列表 = 加载全部 (baseline训练|离线训练)
player_names_files = []

# 训练轮数，离线训练通常为 1 (baseline训练|离线训练)
num_epochs = 1

# 是否启用数据增强（牌谱 augmentation，如座次旋转）(baseline训练|离线训练)
enable_augmentation = false

# 增强数据是否优先加载 (baseline训练|离线训练)
augmented_first = false

# ============================================================
# [env] 强化学习环境参数 (baseline训练|离线训练|在线训练)
# ============================================================
[env]
# reward 折扣因子 (baseline训练|离线训练|在线训练)
gamma = 0.99

# n-step TD 的步数 (baseline训练|离线训练|在线训练)
n_step = 3

# 四个名次对应的点位，用于 GRP reward 计算 (baseline训练|离线训练|在线训练)
pts = [6.0, 4.0, 2.0, 0.0]

# ============================================================
# [resnet] ConvNeXt Encoder 架构参数 (baseline训练|离线训练|在线训练|1v3|review)
# 1v3/review 从 checkpoint 的 config 中读取，非此文件
# ============================================================
[resnet]
# Conv1d 通道数 (baseline训练|离线训练|在线训练|1v3|review)
conv_channels = 192

# ConvNeXt block 数量 (baseline训练|离线训练|在线训练|1v3|review)
num_blocks = 40

# layer scale 初始值，使残差分支初始输出接近 0 稳定收敛 (baseline训练|离线训练|在线训练|1v3|review)
layer_scale = 1e-6

# dropout 概率，0 = 不使用 (baseline训练|离线训练|在线训练|1v3|review)
drop_rate = 0.0

# ============================================================
# [iql] IQL 离线强化学习参数 (离线训练)
# 在线训练使用 Double DQN loss，不使用 tau/beta/clip
# ema_decay 在在线和离线均使用
# ============================================================
[iql]
# expectile regression 的 tau，偏向正 TD 的权重 (离线训练)
tau = 0.7

# advantage 指数缩放系数，越小越激进 (离线训练)
beta = 3.0

# exp_adv 上限，过大易在 fp16 下溢出为 inf (离线训练)
clip = 20.0

# target network EMA 软更新系数，target = ema_decay * target + (1-ema_decay) * online (离线训练|在线训练)
ema_decay = 0.995

# ============================================================
# [aux] 多任务辅助头权重 (baseline训练|离线训练|在线训练)
# 权重为 0 时该辅助任务不参与 loss
# ============================================================
[aux]
# 预测下一局排名(4类)的 loss 权重 (baseline训练|离线训练|在线训练)
next_rank_weight = 0.2

# 预测当前向听数(7类)的 loss 权重 (baseline训练|离线训练|在线训练)
shanten_weight = 0.1

# 预测当前副露数(7类)的 loss 权重 (baseline训练|离线训练|在线训练)
fuuro_weight = 0.05

# 预测本局立直巡目(7类，0=未立直)的 loss 权重 (baseline训练|离线训练|在线训练)
riichi_turn_weight = 0.05

# ============================================================
# [dqn] Ensemble DQN 参数 (baseline训练|离线训练|在线训练|1v3|review)
# num_heads 用于模型构建，所有场景都需读取
# uncertainty_scale 仅在线训练 self-play 探索时使用
# ============================================================
[dqn]
# ensemble head 数量，head 间方差驱动不确定性估计，1 = 单 head 退化为标准 DQN (baseline训练|离线训练|在线训练|1v3|review)
num_heads = 5

# 不确定性探索强度，logits += uncertainty_scale * head_std，仅 self-play 探索生效 (在线训练)
uncertainty_scale = 2.0

# ============================================================
# [reward] turn-level reward 细化 (baseline训练|离线训练|在线训练)
# 叠加到 n_step_reward 上，需配合 GRP 全局 reward 作为锚点
# ============================================================
[reward]
# 立直步的额外 reward (baseline训练|离线训练|在线训练)
riichi = 0.1

# 和牌步的额外 reward (baseline训练|离线训练|在线训练)
agari = 0.3

# 放炮步的额外 reward (负值) (baseline训练|离线训练|在线训练)
houjuu = -0.3

# ============================================================
# [optim] 优化器参数 (baseline训练|离线训练|在线训练)
# ============================================================
[optim]
# AdamW eps (baseline训练|离线训练|在线训练)
eps = 1e-8

# AdamW betas (baseline训练|离线训练|在线训练)
betas = [0.9, 0.999]

# weight decay，仅作用于 Conv1d/Linear 的 weight (baseline训练|离线训练|在线训练)
weight_decay = 0.1

# 梯度裁剪范数，0 = 不裁剪 (baseline训练|离线训练|在线训练)
max_grad_norm = 1.0

# ============================================================
# [optim.scheduler] 学习率调度器 (baseline训练|离线训练|在线训练)
# LinearWarmUp + CosineAnnealing
# ============================================================
[optim.scheduler]
# warmup 结束后的峰值学习率 (baseline训练|离线训练|在线训练)
peak = 1.5e-4

# cosine 退火结束时的最终学习率 (baseline训练|离线训练|在线训练)
final = 3e-5

# warmup 步数，0 = 不做 warmup (baseline训练|离线训练|在线训练)
warm_up_steps = 5000

# cosine 周期总步数，0 = 不做退火 (baseline训练|离线训练|在线训练)
max_steps = 230000

# ============================================================
# [baseline] baseline 模型 checkpoint 配置
# test = test_play 对战对手 (离线训练|在线训练)
# train = 在线 self-play 对战对手 (在线训练)
# ============================================================
[baseline.train]
# baseline 推理设备 (在线训练)
device = 'cuda:0'

# 是否编译 baseline 模型 (在线训练)
enable_compile = false

# baseline checkpoint 路径，TrainPlayer 加载作为 self-play 对手 (在线训练)
state_file = 'D:/Workspace/Mortal/mortal/baseline_v1/baseline.pth'

[baseline.test]
# baseline 推理设备 (离线训练|在线训练)
device = 'cuda:0'

# 是否编译 baseline 模型 (离线训练|在线训练)
enable_compile = false

# baseline checkpoint 路径，TestPlayer 加载作为 test_play 对手 (离线训练|在线训练)
state_file = 'D:/Workspace/Mortal/mortal/baseline_v1/baseline.pth'

# ============================================================
# [online] 在线 self-play 架构配置 (在线训练)
# server.py 管理参数分发与对局收集，client.py 拉取参数进行 self-play
# ============================================================
[online]
# 滑动窗口大小，用于统计最近 N 轮 self-play 的平均排名 (在线训练)
history_window = 50

# 是否编译在线训练用模型 (在线训练)
enable_compile = false

[online.remote]
# server 监听地址 (在线训练)
host = '127.0.0.1'

# server 监听端口 (在线训练)
port = 5000

[online.server]
# self-play 对局日志缓冲目录 (在线训练)
buffer_dir = 'D:/Workspace/Mortal/mortal/mortal_v2/buffer'

# drain 目录，train.py 从这里获取训练数据 (在线训练)
drain_dir = 'D:/Workspace/Mortal/mortal/mortal_v2/drain'

# 缓冲区容量，达到后通知 client 停止生成新数据 (在线训练)
capacity = 1600

# 是否强制顺序模式，true 时 trainer 忙则 client 等待 (在线训练)
force_sequential = false

# ============================================================
# [1v3] 1v3 对战评估配置 (1v3)
# ============================================================
[1v3]
# 随机种子密钥，-1 = 随机生成 (1v3)
seed_key = -1

# 每轮对局数 (1v3)
games_per_iter = 2000

# 总轮数 (1v3)
iters = 500

# 对战日志保存目录 (1v3)
log_dir = 'D:/Workspace/Mortal/mortal/mortal_v2/1v3'

[1v3.challenger]
# challenger 推理设备 (1v3)
device = 'cuda:0'

# challenger 显示名称 (1v3)
name = 'mortal'

# challenger checkpoint 路径 (1v3)
state_file = 'D:/Workspace/Mortal/mortal/mortal_v2/best.pth'

# 是否编译 challenger 模型 (1v3)
enable_compile = false

# 是否启用混合精度推理 (1v3)
enable_amp = true

# 是否启用规则 based agari guard（防和牌误判）(1v3)
enable_rule_based_agari_guard = true

[1v3.champion]
# champion 推理设备 (1v3)
device = 'cuda:0'

# champion 显示名称 (1v3)
name = 'baseline'

# champion checkpoint 路径 (1v3)
state_file = 'D:/Workspace/Mortal/mortal/baseline_v1/baseline.pth'

# 是否编译 champion 模型 (1v3)
enable_compile = false

# 是否启用混合精度推理 (1v3)
enable_amp = true

# 是否启用规则 based agari guard (1v3)
enable_rule_based_agari_guard = true

[1v3.akochan]
# 是否使用 akochan 作为 champion（替代 py 模型）(1v3)
enabled = false

# akochan 安装目录 (1v3)
dir = '/path/to/akochan'

# akochan tactics 配置文件 (1v3)
tactics = '/path/to/tactics.json'

# ============================================================
# [grp] GRP 模型配置
# train_grp.py 用于训练，dataloader.py 加载 GRP 计算 reward
# ============================================================
[grp]
# GRP checkpoint 路径，dataloader 加载用于计算 kyoku_reward (GRP训练|baseline训练|离线训练|在线训练)
state_file = 'D:/Workspace/Mortal/mortal/grp_v2/grp_best.pth'

# GRP 最优模型路径，train_grp.py 按验证 loss 保存 (GRP训练)
best_state_file = 'D:/Workspace/Mortal/mortal/grp_v2/grp_best.pth'

# ============================================================
# [grp.network] GRP 网络架构 (GRP训练|baseline训练|离线训练|在线训练)
# ============================================================
[grp.network]
# Transformer hidden size (GRP训练|baseline训练|离线训练|在线训练)
hidden_size = 128

# Transformer 层数 (GRP训练|baseline训练|离线训练|在线训练)
num_layers = 2

# 多头注意力头数 (GRP训练|baseline训练|离线训练|在线训练)
nhead = 4

# ============================================================
# [grp.control] GRP 训练控制 (GRP训练)
# ============================================================
[grp.control]
# GRP 训练设备 (GRP训练)
device = 'cuda:0'

# 是否启用 cudnn benchmark (GRP训练)
enable_cudnn_benchmark = true

# TensorBoard 日志目录 (GRP训练)
tensorboard_dir = 'D:/Workspace/Mortal/mortal/grp_v2/log'

# GRP 训练 batch size (GRP训练)
batch_size = 512

# 每隔多少步保存 checkpoint + 验证 (GRP训练)
save_every = 2000

# 验证集评估步数 (GRP训练)
val_steps = 400

# ============================================================
# [grp.dataset] GRP 训练数据 (GRP训练)
# ============================================================
[grp.dataset]
# 训练集 glob 模式 (GRP训练)
train_globs = [
    'D:/Workspace/Mortal/mortal/grp_data/train/**/*.json.gz',
]

# 验证集 glob 模式 (GRP训练)
val_globs = [
    'D:/Workspace/Mortal/mortal/grp_data/val/**/*.json.gz',
]

# 文件索引缓存路径 (GRP训练)
file_index = 'D:/Workspace/Mortal/mortal/grp_v2/file_index.pth'

# 每次并行加载的文件数 (GRP训练)
file_batch_size = 50

# ============================================================
# [grp.optim] GRP 优化器 (GRP训练)
# ============================================================
[grp.optim]
# GRP 训练学习率 (GRP训练)
lr = 1e-5
