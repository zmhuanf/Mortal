# 标记说明:
#   GRP训练      = train_grp.py 训练 GRP 模型
#   baseline训练 = train.py 以 is_baseline=true 模式训练 baseline
#   离线训练     = train.py 以 online=false 模式训练正式模型
#   在线训练     = train.py 以 online=true 模式训练 + server.py + client.py
#   1v3          = one_vs_three.py 1v3 对战评估
#   review       = mortal.py review 模式分析对局

# 配置文件按大类拆分，本文件为入口，include 列表按需增删
#   conf/base.toml      = control / env / resnet / dqn
#   conf/train.toml     = dataset / iql / aux / reward / optim
#   conf/online.toml    = train_play / online / baseline
#   conf/evaluate.toml  = test_play / 1v3
#   conf/grp.toml       = grp

include = [
    'conf/base.toml',
    'conf/train.toml',
    'conf/online.toml',
    'conf/evaluate.toml',
    'conf/grp.toml',
]
