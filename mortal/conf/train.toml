# 训练相关配置 (baseline训练|离线训练|在线训练)

# ============================================================
# [dataset] 牌谱数据集配置 (baseline训练|离线训练|在线训练)
# 在线训练时从 drain 目录加载 self-play 数据，忽略此配置
# ============================================================
[dataset]
# 牌谱文件 glob 模式，支持 .mjson 和 .json.gz (baseline训练|离线训练)
globs = ['D:/Data/**/*.mjson']

# 文件索引缓存路径，首次构建后后续启动跳过 glob 扫描 (baseline训练|离线训练)
file_index = 'D:/Workspace/Mortal/mortal/mortal_v2/file_index.pth'

# 每次并行加载的文件数，影响内存占用和 IO 吞吐 (baseline训练|离线训练)
file_batch_size = 15

# 保留比例，前 reserve_ratio 比例的样本不参与训练，用于验证 (baseline训练|离线训练)
reserve_ratio = 0.0

# DataLoader 工作进程数 (baseline训练|离线训练)
num_workers = 2

# 只加载包含这些玩家名的牌谱，空列表 = 加载全部 (baseline训练|离线训练)
player_names_files = []

# 训练轮数，离线训练通常为 1 (baseline训练|离线训练)
num_epochs = 1

# 是否启用数据增强（牌谱 augmentation，如座次旋转）(baseline训练|离线训练)
enable_augmentation = false

# 增强数据是否优先加载 (baseline训练|离线训练)
augmented_first = false

# ============================================================
# [iql] IQL 离线强化学习参数 (离线训练|在线训练)
# 在线与离线统一使用 IQL + AWR，tau/beta/clip 均生效
# ema_decay 在在线和离线均使用
# ============================================================
[iql]
# expectile regression 的 tau，偏向正 TD 的权重 (离线训练)
tau = 0.7

# advantage 指数缩放系数，越小越激进 (离线训练)
beta = 3.0

# exp_adv 上限，过大易在 fp16 下溢出为 inf (离线训练)
clip = 20.0

# target network EMA 软更新系数，target = ema_decay * target + (1-ema_decay) * online (离线训练|在线训练)
ema_decay = 0.995

# ============================================================
# [aux] 多任务辅助头权重 (baseline训练|离线训练|在线训练)
# 权重为 0 时该辅助任务不参与 loss
# ============================================================
[aux]
# 预测下一局排名(4类)的 loss 权重 (baseline训练|离线训练|在线训练)
next_rank_weight = 0.2

# 预测当前向听数(7类)的 loss 权重 (baseline训练|离线训练|在线训练)
shanten_weight = 0.1

# 预测当前副露数(7类)的 loss 权重 (baseline训练|离线训练|在线训练)
fuuro_weight = 0.05

# 预测本局立直巡目(7类，0=未立直)的 loss 权重 (baseline训练|离线训练|在线训练)
riichi_turn_weight = 0.05

# ============================================================
# [reward] turn-level reward 细化 (baseline训练|离线训练|在线训练)
# 叠加到 n_step_reward 上，需配合 GRP 全局 reward 作为锚点
# ============================================================
[reward]
# 立直步的额外 reward (baseline训练|离线训练|在线训练)
riichi = 0.15

# 和牌步的额外 reward (baseline训练|离线训练|在线训练)
agari = 0.5

# 放炮步的额外 reward (负值) (baseline训练|离线训练|在线训练)
houjuu = -0.15

# ============================================================
# [optim] 优化器参数 (baseline训练|离线训练|在线训练)
# ============================================================
[optim]
# AdamW eps (baseline训练|离线训练|在线训练)
eps = 1e-8

# AdamW betas (baseline训练|离线训练|在线训练)
betas = [0.9, 0.999]

# weight decay，仅作用于 Conv1d/Linear 的 weight (baseline训练|离线训练|在线训练)
weight_decay = 0.1

# 梯度裁剪范数，0 = 不裁剪 (baseline训练|离线训练|在线训练)
max_grad_norm = 1.0

# ============================================================
# [optim.scheduler] 学习率调度器 (baseline训练|离线训练|在线训练)
# LinearWarmUp + CosineAnnealing
# ============================================================
[optim.scheduler]
# warmup 结束后的峰值学习率 (baseline训练|离线训练|在线训练)
peak = 1.5e-4

# cosine 退火结束时的最终学习率 (baseline训练|离线训练|在线训练)
final = 1.5e-4

# warmup 步数，0 = 不做 warmup (baseline训练|离线训练|在线训练)
warm_up_steps = 5000

# cosine 周期总步数，0 = 不做退火 (baseline训练|离线训练|在线训练)
max_steps = 5000
