[package]
name = "akagi_bridge"
version = "0.1.0"
edition = "2024"

# 独立于 Mortal 根 workspace，避免继承其编译配置
[workspace]

[[bin]]
name = "akagi_mjai_bot"
path = "src/main.rs"

[dependencies]
# Akagi 仓库内的 native_bot crate：candle CNN 推理 + 内嵌 4p/3p 权重
native_bot = { path = "D:/download/Akagi-3/native_bot" }
# 与 native_bot 锁定的版本一致，直接反序列化 mjai 事件
riichienv-core = "0.4.8"
serde_json = "1"
anyhow = "1"
